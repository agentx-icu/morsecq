name: Native (libtim2tox_ffi)

# Builds the Tim2Tox FFI shim (c-toxcore + pinned static libsodium, NO ToxAV)
# for every morsecq target, uploads each as a workflow artifact, then proves the
# three desktop apps still build in release mode against it with the real Tox
# backend compiled in (--dart-define=MORSECQ_FAKE_BACKEND=false).
#
# Modelled on toxee's build-packages.yml / analyze.yml (same pinned actions,
# same runner images, same libtim2tox_ffi cache keyed on the tim2tox submodule
# SHA + the build script). Linux aarch64 and Windows arm64 are experimental
# (continue-on-error), as in toxee. Every run also builds the Android and iOS
# apps and turns all five release builds into installable packages
# (tool/ci/package_artifacts.sh: .deb/.rpm/.tar.gz, .msi/.zip, .pkg/.zip,
# .apk/.aab, unsigned .ipa); on a v* tag job `release` attaches them to that
# tag's GitHub release.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - ".github/workflows/native.yml"
      - "tool/ci/**"
      - "tool/bootstrap_deps.dart"
      - "tool/vendor_overlay.dart"
      - "third_party/overlays/**"
      - "tool/build_android_ffi.sh"
      - "tool/build_ios_ffi.sh"
      - "build_all.sh"
      - "third_party/tim2tox"
      - ".gitmodules"
      - "apps/morsecq/android/**"
      - "apps/morsecq/ios/**"
      - "apps/morsecq/linux/**"
      - "apps/morsecq/macos/**"
      - "apps/morsecq/windows/**"
      - "packages/morsecq_chat/**"
  pull_request:
    branches: [main, master]
    paths:
      - ".github/workflows/native.yml"
      - "tool/ci/**"
      - "tool/bootstrap_deps.dart"
      - "tool/vendor_overlay.dart"
      - "third_party/overlays/**"
      - "tool/build_android_ffi.sh"
      - "tool/build_ios_ffi.sh"
      - "build_all.sh"
      - "third_party/tim2tox"
      - ".gitmodules"
      - "apps/morsecq/android/**"
      - "apps/morsecq/ios/**"
      - "apps/morsecq/linux/**"
      - "apps/morsecq/macos/**"
      - "apps/morsecq/windows/**"
      - "packages/morsecq_chat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  FLUTTER_VERSION: "3.41.9"
  # The Dart SDK bundled by FLUTTER_VERSION (flutter/bin/cache/dart-sdk/version).
  # Flutter publishes no Linux/Windows arm64 SDK archive, so the arm64 native
  # jobs install this standalone Dart SDK instead: the FFI build only needs
  # its include/ (dart_api_dl.[ch]), and the version must match the VM the
  # Flutter engine embeds. Bump both together.
  DART_VERSION: "3.11.5"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Native library per target
  # ---------------------------------------------------------------------------
  native:
    name: native ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            experimental: false
            timeout: 45
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            experimental: true
            timeout: 60
            dart_only: true
          - target: windows-x64
            runner: windows-2022
            experimental: false
            timeout: 75
            vcpkg_triplet: x64-windows
            msvc_arch: amd64
          - target: windows-arm64
            runner: windows-11-arm
            experimental: true
            timeout: 90
            vcpkg_triplet: arm64-windows
            msvc_arch: arm64
            dart_only: true
          - target: macos-x86_64
            runner: macos-15-intel
            experimental: false
            timeout: 45
          - target: macos-arm64
            runner: macos-15
            experimental: false
            timeout: 45
          - target: android
            runner: ubuntu-24.04
            experimental: false
            timeout: 75
          - target: ios
            runner: macos-15
            experimental: false
            timeout: 75

    steps:
      - name: Configure Git line endings (Windows)
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # Flutter is needed by the NATIVE build too: tim2tox/ffi/CMakeLists.txt
      # compiles dart_api_dl.c from the Flutter-bundled Dart SDK.
      - name: Set up Flutter
        if: matrix.dart_only != true
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Precache Dart SDK headers
        if: matrix.dart_only != true
        run: flutter --version

      # ubuntu-24.04-arm / windows-11-arm: subosito/flutter-action fails with
      # "Unable to determine Flutter version ... architecture: arm64" because
      # Flutter ships only x64 archives for Linux/Windows. The standalone Dart
      # SDK (same version Flutter bundles) is published for both arm64
      # platforms; build_tim2tox.sh stages its include/ under a shim
      # FLUTTER_ROOT when `dart` is on PATH and `flutter` is not.
      - name: Set up Dart SDK (arm64 runner, no Flutter archive)
        if: matrix.dart_only == true
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}
          architecture: arm64

      - name: Verify Dart SDK headers (arm64 runner)
        if: matrix.dart_only == true
        run: |
          set -euo pipefail
          dart --version
          sdk="$(cd "$(dirname "$(command -v dart)")/.." && pwd)"
          # Tim2Tox compiles dart_api_dl.c as well as including the header.
          for f in dart_api_dl.h dart_api_dl.c; do
            [[ -f "$sdk/include/$f" ]] || { echo "::error::$f missing under $sdk/include"; exit 1; }
          done
          echo "dart sdk: $sdk ($(cat "$sdk/version"))"

      - name: Resolve tim2tox revision (cache key)
        id: t2t_rev
        run: echo "sha=$(git rev-parse HEAD:third_party/tim2tox)" >> "$GITHUB_OUTPUT"

      # libtim2tox_ffi is a pure function of (tim2tox SHA, target, build
      # script, toolchain image); cache the finished artifact directory and skip
      # the build on a hit. The dependency prefix (static libsodium) is cached
      # separately so a tim2tox bump does not rebuild libsodium.
      - name: Cache built libtim2tox_ffi
        id: cache_native
        uses: actions/cache@v4
        with:
          path: build/native/${{ matrix.target }}
          # The Flutter/Dart pins are part of the key on EVERY row: the library
          # compiles dart_api_dl.c from the SDK headers, so a pin bump must not
          # restore a cache entry built against older headers (the Dart-only
          # arm64 rows read DART_VERSION, the others get Dart via FLUTTER_VERSION).
          key: tim2tox-ffi-${{ matrix.target }}-notoxav-nosqlite-${{ steps.t2t_rev.outputs.sha }}-flutter${{ env.FLUTTER_VERSION }}-dart${{ env.DART_VERSION }}-${{ hashFiles('tool/ci/build_tim2tox.sh', 'tool/ci/common.sh', 'tool/build_ios_ffi.sh') }}

      - name: Cache libsodium prefix
        if: steps.cache_native.outputs.cache-hit != 'true' && !startsWith(matrix.target, 'windows')
        uses: actions/cache@v4
        with:
          path: build/native/.deps
          key: libsodium-1.0.20-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tool/ci/build_tim2tox.sh') }}

      # ---- per-OS prerequisites --------------------------------------------
      - name: Install Linux build dependencies
        if: runner.os == 'Linux' && steps.cache_native.outputs.cache-hit != 'true'
        run: |
          set -e
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config patchelf; then
              exit 0
            fi
            echo "apt-get attempt $attempt failed; retrying" >&2
            sleep $((attempt * 15))
          done
          exit 1

      - name: Install macOS build dependencies
        if: runner.os == 'macOS' && steps.cache_native.outputs.cache-hit != 'true'
        run: brew install cmake ninja pkg-config

      - name: Set up Java (Android)
        if: matrix.target == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # vcpkg provides libsodium (dynamic) + pthreads-win32 + pkgconf; both DLLs
      # are captured next to tim2tox_ffi.dll by the build script.
      - name: Install vcpkg and native dependencies (Windows)
        if: runner.os == 'Windows' && steps.cache_native.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone --depth 1 https://github.com/microsoft/vcpkg $vcpkgRoot
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          & "$vcpkgRoot\vcpkg.exe" install `
            libsodium:${{ matrix.vcpkg_triplet }} `
            pthreads:${{ matrix.vcpkg_triplet }} `
            pkgconf:${{ matrix.vcpkg_triplet }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # vcvars so cmake's project() finds MSVC for the requested arch.
      - name: Set up MSVC developer environment (Windows)
        if: runner.os == 'Windows' && steps.cache_native.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      # ---- build ------------------------------------------------------------
      - name: Build libtim2tox_ffi (desktop)
        if: steps.cache_native.outputs.cache-hit != 'true' && matrix.target != 'android' && matrix.target != 'ios'
        env:
          # msvc-dev-cmd leaks VS's bundled vcpkg into VCPKG_ROOT; re-pin ours.
          VCPKG_ROOT: ${{ runner.os == 'Windows' && format('{0}/vcpkg', runner.temp) || '' }}
        run: bash tool/ci/build_tim2tox.sh --target "${{ matrix.target }}" --mode release --no-stage-app

      # The ubuntu image exports ANDROID_NDK_LATEST_HOME / ANDROID_HOME as
      # process env (not in the `env` context), so resolve the NDK in the shell.
      # find_android_ndk() also scans $ANDROID_HOME/ndk/* as a fallback.
      - name: Build libtim2tox_ffi (Android, all ABIs)
        if: steps.cache_native.outputs.cache-hit != 'true' && matrix.target == 'android'
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME ANDROID_HOME=${ANDROID_HOME:-}"
          bash tool/ci/build_tim2tox.sh --target android --android-abis arm64-v8a,armeabi-v7a,x86_64 --mode release --no-stage-app

      # ios = device slice + universal simulator slice + the XCFramework the
      # Podfile vendors. The artifact directory carries all three.
      - name: Build libtim2tox_ffi (iOS device + simulator, XCFramework)
        if: steps.cache_native.outputs.cache-hit != 'true' && matrix.target == 'ios'
        env:
          MORSECQ_IOS_XCFRAMEWORK_DIR: ${{ github.workspace }}/build/native/ios
        run: |
          bash tool/build_ios_ffi.sh --mode release
          cp -R build/native/ios-device build/native/ios/ios-device
          cp -R build/native/ios-simulator build/native/ios/ios-simulator

      # Gate the BYTES that will be uploaded (a cache hit never ran CMake).
      - name: Assert artifact carries no Tim2Tox test hooks
        run: bash tool/ci/assert_no_test_hooks.sh "build/native/${{ matrix.target }}"

      - name: List artifact
        run: find "build/native/${{ matrix.target }}" -maxdepth 3 | sort

      - name: Upload libtim2tox_ffi
        uses: actions/upload-artifact@v4
        with:
          name: tim2tox-ffi-${{ matrix.target }}
          path: build/native/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 2. Desktop app builds consuming the artifact (release, real backend)
  # ---------------------------------------------------------------------------
  app-linux:
    name: flutter build linux (x86_64, release)
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config clang libgtk-3-dev liblzma-dev libstdc++-12-dev patchelf libsecret-1-dev libayatana-appindicator3-dev libasound2-dev rpm
      - name: Download libtim2tox_ffi
        uses: actions/download-artifact@v5
        with:
          name: tim2tox-ffi-linux-x86_64
          path: build/native/linux-x86_64
      - name: Bootstrap dependencies
        run: dart run tool/bootstrap_deps.dart
      - name: Resolve workspace
        run: dart pub get
      - name: Build Linux app (release, real Tox backend)
        run: |
          flutter config --enable-linux-desktop
          cd apps/morsecq
          flutter build linux --release --dart-define=MORSECQ_FAKE_BACKEND=false
      - name: Verify the bundle ships libtim2tox_ffi.so
        run: |
          set -euo pipefail
          so="$(find apps/morsecq/build/linux -path '*/release/bundle/lib/libtim2tox_ffi.so' -print -quit)"
          [[ -n "$so" ]] || { echo "::error::libtim2tox_ffi.so missing from the Linux bundle"; exit 1; }
          echo "bundled: $so"
          readelf -d "$so" | grep -E 'RUNPATH|RPATH' || true
          bash tool/ci/assert_no_test_hooks.sh "$so"
      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: morsecq-linux-x86_64-release
          path: apps/morsecq/build/linux/x64/release/bundle
          if-no-files-found: error
          retention-days: 14
      # Packed on the build runner: upload-artifact drops file modes (and
      # symlinks), so only finished packages leave the machine.
      - name: Package (.deb, .rpm, .tar.gz)
        run: bash tool/ci/package_artifacts.sh --target linux
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/linux/*
          if-no-files-found: error
          retention-days: 14

  app-windows:
    name: flutter build windows (x64, release)
    needs: native
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Configure Git line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Download tim2tox_ffi.dll (+ libsodium.dll, pthreadVC3.dll)
        uses: actions/download-artifact@v5
        with:
          name: tim2tox-ffi-windows-x64
          path: build/native/windows-x64
      - name: Bootstrap dependencies
        run: dart run tool/bootstrap_deps.dart
      - name: Resolve workspace
        run: dart pub get
      - name: Build Windows app (release, real Tox backend)
        run: |
          flutter config --enable-windows-desktop
          cd apps/morsecq
          flutter build windows --release --dart-define=MORSECQ_FAKE_BACKEND=false
      - name: Verify the runner ships tim2tox_ffi.dll and its runtime DLLs
        run: |
          set -euo pipefail
          dir="apps/morsecq/build/windows/x64/runner/Release"
          for f in tim2tox_ffi.dll libsodium.dll; do
            [[ -f "$dir/$f" ]] || { echo "::error::$f missing from $dir"; exit 1; }
            echo "bundled: $dir/$f"
          done
          [[ -f "$dir/pthreadVC3.dll" ]] && echo "bundled: $dir/pthreadVC3.dll" || echo "note: pthreadVC3.dll not bundled (only needed if tim2tox_ffi.dll imports it)"
          bash tool/ci/assert_no_test_hooks.sh "$dir/tim2tox_ffi.dll"
      - name: Upload Windows runner
        uses: actions/upload-artifact@v4
        with:
          name: morsecq-windows-x64-release
          path: apps/morsecq/build/windows/x64/runner/Release
          if-no-files-found: error
          retention-days: 14
      # CPack's WIX generator needs WiX v3 (candle/light) on PATH. Same search
      # as toxee: preinstalled image paths, else Chocolatey, else the release zip.
      - name: Put WiX v3 on PATH
        shell: pwsh
        run: |
          function Find-WixBin {
            $patterns = @(
              "C:\Program Files (x86)\WiX Toolset v3.*\bin",
              "C:\ProgramData\chocolatey\lib\wixtoolset\tools\*\bin",
              "C:\ProgramData\chocolatey\lib\wixtoolset\tools\bin",
              "$env:RUNNER_TEMP\wix"
            )
            foreach ($p in $patterns) {
              $hit = Get-ChildItem -Path $p -ErrorAction SilentlyContinue |
                     Where-Object { Test-Path (Join-Path $_.FullName "candle.exe") } |
                     Select-Object -First 1
              if ($hit) { return $hit.FullName }
              if (Test-Path (Join-Path $p "candle.exe")) { return $p }
            }
            return $null
          }
          $wix = Find-WixBin
          if (-not $wix) {
            choco install wixtoolset --yes --no-progress --version 3.14.1 2>&1 | Write-Host
            $wix = Find-WixBin
          }
          if (-not $wix) {
            $zip = Join-Path $env:RUNNER_TEMP "wix314-binaries.zip"
            Invoke-WebRequest -UseBasicParsing -OutFile $zip `
              -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
            Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "wix") -Force
            $wix = Find-WixBin
          }
          if (-not $wix) { Write-Error "WiX Toolset v3 not found"; exit 1 }
          Write-Host "WiX: $wix"
          $wix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Package (.msi, .zip)
        run: bash tool/ci/package_artifacts.sh --target windows
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14

  app-macos:
    name: flutter build macos (arm64, release)
    needs: native
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Download libtim2tox_ffi.dylib
        uses: actions/download-artifact@v5
        with:
          name: tim2tox-ffi-macos-arm64
          path: build/native/macos-arm64
      - name: Bootstrap dependencies
        run: dart run tool/bootstrap_deps.dart
      - name: Resolve workspace
        run: dart pub get
      # Copies the dylib into apps/morsecq/macos/Frameworks/ (the Podfile
      # vendors it from there) and touches the Podfile so pod install re-runs.
      - name: Stage libtim2tox_ffi.dylib into the app
        run: bash tool/ci/build_tim2tox.sh --target macos-arm64 --stage-only
      - name: Build macOS app (release, real Tox backend)
        run: |
          flutter config --enable-macos-desktop
          cd apps/morsecq
          flutter build macos --release --dart-define=MORSECQ_FAKE_BACKEND=false
      - name: Verify the app bundle embeds libtim2tox_ffi.dylib
        run: |
          set -euo pipefail
          app="$(find apps/morsecq/build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          [[ -n "$app" ]] || { echo "::error::no .app produced"; exit 1; }
          dylib="$app/Contents/Frameworks/libtim2tox_ffi.dylib"
          [[ -f "$dylib" ]] || { echo "::error::libtim2tox_ffi.dylib missing from $app/Contents/Frameworks"; ls -R "$app/Contents/Frameworks" || true; exit 1; }
          echo "embedded: $dylib"
          otool -L "$dylib" | head -20
          codesign --verify --strict "$dylib"
          bash tool/ci/assert_no_test_hooks.sh "$dylib"
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: morsecq-macos-arm64-release
          path: apps/morsecq/build/macos/Build/Products/Release/*.app
          if-no-files-found: error
          retention-days: 14
      - name: Package (.pkg, .zip)
        run: bash tool/ci/package_artifacts.sh --target macos
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/macos/*
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 3. Mobile app builds consuming the artifact (release, real backend)
  # ---------------------------------------------------------------------------
  app-android:
    name: flutter build apk + appbundle (release)
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Download libtim2tox_ffi (all ABIs)
        uses: actions/download-artifact@v5
        with:
          name: tim2tox-ffi-android
          path: build/native/android
      - name: Bootstrap dependencies
        run: dart run tool/bootstrap_deps.dart
      - name: Resolve workspace
        run: dart pub get
      # Copies build/native/android/jniLibs/<abi>/ into the app's jniLibs; the
      # Gradle build packages exactly those ABIs and byte-checks them.
      - name: Stage libtim2tox_ffi.so into the app
        run: bash tool/ci/build_tim2tox.sh --target android --stage-only
      # Optional: with all four secrets the release is signed with the project
      # key (app/build.gradle.kts reads the MORSECQ_ANDROID_* env verbatim);
      # without them it is signed with the debug key.
      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/morsecq-release.jks"
            echo "MORSECQ_ANDROID_KEYSTORE=$RUNNER_TEMP/morsecq-release.jks" >> "$GITHUB_ENV"
            echo "release signing: project key"
          else
            echo "::warning::No Android signing secrets; the release APK/AAB are signed with the debug key."
          fi
      - name: Build APK and App Bundle (release, real Tox backend)
        env:
          MORSECQ_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MORSECQ_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MORSECQ_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd apps/morsecq
          flutter build apk --release --dart-define=MORSECQ_FAKE_BACKEND=false
          flutter build appbundle --release --dart-define=MORSECQ_FAKE_BACKEND=false
      - name: Package (.apk, .aab)
        run: bash tool/ci/package_artifacts.sh --target android
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14

  app-ios:
    name: flutter build ios (release, unsigned)
    needs: native
    # Xcode 26 / iOS 26 SDK: device_info_plus 13.2 calls
    # NSProcessInfo.isiOSAppOnVision, which the Xcode 16 SDK on macos-15 lacks
    # (and the App Store requires the iOS 26 SDK anyway).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Download libtim2tox_ffi (XCFramework)
        uses: actions/download-artifact@v5
        with:
          name: tim2tox-ffi-ios
          path: build/native/ios
      - name: Bootstrap dependencies
        run: dart run tool/bootstrap_deps.dart
      - name: Resolve workspace
        run: dart pub get
      # Tim2ToxFFI.podspec vendors the XCFramework from apps/morsecq/ios/Frameworks.
      - name: Stage tim2tox_ffi.xcframework into the app
        run: |
          rm -rf apps/morsecq/ios/Frameworks/tim2tox_ffi.xcframework
          cp -R build/native/ios/tim2tox_ffi.xcframework apps/morsecq/ios/Frameworks/
      # No signing identity on CI: the .ipa is unsigned (sideload tools or a
      # re-sign step sign it), as toxee ships without iOS secrets.
      - name: Build iOS app (release, real Tox backend, no codesign)
        run: |
          cd apps/morsecq
          flutter build ios --release --no-codesign --dart-define=MORSECQ_FAKE_BACKEND=false
      - name: Package (unsigned .ipa)
        run: bash tool/ci/package_artifacts.sh --target ios
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 4. On a v* tag: attach every package (+ SHA256SUMS) to the GitHub release
  #    of that tag, creating a draft when none exists yet.
  # ---------------------------------------------------------------------------
  release:
    name: GitHub release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [app-linux, app-windows, app-macos, app-android, app-ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
              --title "morsecq $GITHUB_REF_NAME" --generate-notes -R "$GITHUB_REPOSITORY"
          fi
