name: Layout
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Resolve pinned workspace
        run: dart pub get --enforce-lockfile
      - name: Install real multilingual fonts
        run: |
          # The hosted image's Azure mirror stalled twice downloading these fonts.
          # Keep its archive keyring and source suites; change only that mirror URL.
          grep -F 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' /etc/apt/sources.list.d/ubuntu.sources
          test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
          sudo sed -i 's|^http://azure\.archive\.ubuntu\.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|' /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt
          apt_options=(-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y fonts-noto-core fonts-noto-cjk fonts-noto-mono fontconfig
          test -s /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
          test -s /usr/share/fonts/opentype/noto/NotoSerifCJK-Regular.ttc
      - name: Every screen at every window size, language and text scale
        shell: bash
        run: |
          set -euo pipefail
          mono="$(fc-match -f '%{file}' 'Noto Sans Mono')"
          test -s "$mono"
          cd apps/morsecq
          flutter test test/layout/ --no-pub \
            --dart-define=MORSECQ_MATRIX_FONT=/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc \
            --dart-define=MORSECQ_MATRIX_MONO_FONT="$mono" \
            --dart-define=MORSECQ_MATRIX_SERIF_FONT=/usr/share/fonts/opentype/noto/NotoSerifCJK-Regular.ttc
