name: E2E

# Top of the test pyramid (doc/testing/TEST_PYRAMID.md): the real app on
# macOS, Linux and Windows runners, an iOS simulator and an Android emulator —
# the real main() click-through and the screenshot scene walk, then (desktop)
# the screenshot pipeline itself with the frames as an artifact (the only
# source of the Linux and Windows frames). tool/ci/run_integration_tests.sh
# launches the app once per file and retries a failed file once, with a
# warning annotation, so a retried pass stays visible.
# Opt-in: manual, or the `ci:e2e` label on a pull request.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci:e2e')
    timeout-minutes: 45
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true
          pub-cache: false

      - name: Install dependencies
        run: dart pub get --enforce-lockfile

      # flutter_soloud's generated CMake output embeds runner-specific Xcode
      # paths. Refresh that output while preserving all downloaded source.
      - name: Drop flutter_soloud's cached CMake build
        run: bash tool/ci/clean_apple_plugin_cache.sh macos

      - name: Real-UI tests (offline learning)
        run: bash tool/ci/run_integration_tests.sh -d macos

      # Staging inside the workspace so a failed run's frames are still
      # uploaded (the default staging is a temp dir the runner discards).
      - name: Screenshots
        env:
          MORSECQ_SHOT_STAGING: build/shot_staging
        run: tool/screenshots/capture.sh --platforms macos --out build/screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-macos
          path: |
            build/screenshots
            build/shot_staging
          if-no-files-found: warn

  linux:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci:e2e')
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      # Same package set as the build workflow's Linux app build, plus a
      # virtual X server for the real window and a CJK font: the runner image
      # has none, so the zh frames would render every Chinese glyph as tofu
      # (a Chinese-locale desktop ships one; Flutter uses the system fonts).
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config clang libgtk-3-dev liblzma-dev libstdc++-12-dev dbus-x11 libayatana-appindicator3-dev libasound2-dev xvfb fonts-noto-cjk

      - name: Install dependencies
        run: dart pub get --enforce-lockfile

      # The X screen is larger than the 1280x800 capture window so the
      # harness's exact-size check can hold.
      - name: Real-UI tests (offline learning)
        run: |
          set -euo pipefail
          flutter config --enable-linux-desktop
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            bash tool/ci/run_integration_tests.sh -d linux

      - name: Screenshots
        env:
          MORSECQ_SHOT_STAGING: build/shot_staging
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            tool/screenshots/capture.sh --platforms linux --out build/screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-linux
          path: |
            build/screenshots
            build/shot_staging
          if-no-files-found: warn

  windows:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci:e2e')
    timeout-minutes: 60
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure Git line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      # The runner's display is 1024x768, which squeezes the 1280x800 capture
      # window (the harness then fails on the size, by design). Give the
      # session a 1920x1080 display first.
      - name: Raise the display resolution
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "primary screen: $($b.Width)x$($b.Height)"
          if ($b.Width -lt 1300 -or $b.Height -lt 900) { throw "display still $($b.Width)x$($b.Height)" }

      # capture.sh reads `flutter devices --machine` with python3; the
      # Windows image only has `python`.
      - name: Provide python3
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            mkdir -p "$HOME/shim"
            printf '#!/bin/sh\nexec python "$@"\n' > "$HOME/shim/python3"
            chmod +x "$HOME/shim/python3"
            echo "$HOME/shim" >> "$GITHUB_PATH"
          fi

      - name: Install dependencies
        run: dart pub get --enforce-lockfile

      # One app launch per file (see the macOS job).
      - name: Real-UI tests (offline learning)
        run: |
          set -euo pipefail
          flutter config --enable-windows-desktop
          bash tool/ci/run_integration_tests.sh -d windows

      - name: Screenshots
        env:
          MORSECQ_SHOT_STAGING: build/shot_staging
        run: tool/screenshots/capture.sh --platforms windows --out build/screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-windows
          path: |
            build/screenshots
            build/shot_staging
          if-no-files-found: warn

  ios:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci:e2e')
    timeout-minutes: 75
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true
          pub-cache: false

      - name: Install dependencies
        run: dart pub get --enforce-lockfile

      - name: Drop flutter_soloud's cached CMake build
        run: bash tool/ci/clean_apple_plugin_cache.sh ios

      # The newest available iPhone simulator; rotation_test.dart only runs
      # on a phone or tablet, so this is where it is exercised.
      - name: Boot an iPhone simulator
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, ds in sorted(devices.items()) if "iOS" in runtime
                    for d in ds if d["name"].startswith("iPhone")]
          print(phones[-1]["udid"])')"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"

      - name: Real-UI tests (offline learning)
        run: bash tool/ci/run_integration_tests.sh -d "$SIM_UDID"

  android:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci:e2e')
    timeout-minutes: 75
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: dart pub get --enforce-lockfile

      # Hardware acceleration for the x86_64 emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Audio stays enabled (no -no-audio): the first-day and advanced
      # learning tests drive real playback through flutter_soloud.
      - name: Real-UI tests (offline learning)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: bash tool/ci/run_integration_tests.sh -d emulator-5554
