name: E2E

# Top of the test pyramid (doc/testing/TEST_PYRAMID.md): the real app on a
# macOS runner — the real main() click-through and the screenshot scene walk,
# then the screenshot pipeline itself with the frames as an artifact.
# Opt-in: manual, or the `ci:e2e` label on a pull request.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci:e2e')
    timeout-minutes: 45
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      # Same order as analyze.yml: vendor + overlay before pub get.
      - name: Bootstrap vendored dependencies
        run: dart run tool/bootstrap_deps.dart

      - name: Install dependencies
        run: dart pub get

      # No libtim2tox_ffi on the runner: the Podfile warns and the app is
      # UI-only, which is exactly what the fake backend needs.
      - name: Real-UI tests (fake backend)
        run: |
          set -euo pipefail
          cd apps/morsecq
          flutter test integration_test -d macos \
            --dart-define=MORSECQ_FAKE_BACKEND=true

      - name: Screenshots
        run: tool/screenshots/capture.sh --platforms macos --out build/screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-macos
          path: build/screenshots
          if-no-files-found: warn
