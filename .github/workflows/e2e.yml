name: E2E

# Top of the test pyramid (doc/testing/TEST_PYRAMID.md): the real app on
# macOS, Linux and Windows runners — the real main() click-through and the
# screenshot scene walk, then the screenshot pipeline itself with the frames
# as an artifact (the only source of the Linux and Windows frames).
# Opt-in: manual, or the `ci:e2e` label on a pull request.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci:e2e')
    timeout-minutes: 45
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      # Same order as analyze.yml: vendor + overlay before pub get.
      - name: Bootstrap vendored dependencies
        run: dart run tool/bootstrap_deps.dart

      - name: Install dependencies
        run: dart pub get

      # No libtim2tox_ffi on the runner: the Podfile warns and the app is
      # UI-only, which is exactly what the fake backend needs.
      - name: Real-UI tests (fake backend)
        run: |
          set -euo pipefail
          cd apps/morsecq
          flutter test integration_test -d macos \
            --dart-define=MORSECQ_FAKE_BACKEND=true

      # Staging inside the workspace so a failed run's frames are still
      # uploaded (the default staging is a temp dir the runner discards).
      - name: Screenshots
        env:
          MORSECQ_SHOT_STAGING: build/shot_staging
        run: tool/screenshots/capture.sh --platforms macos --out build/screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-macos
          path: |
            build/screenshots
            build/shot_staging
          if-no-files-found: warn

  linux:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci:e2e')
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      # Same package set as the native workflow's Linux app build, plus a
      # virtual X server for the real window.
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config clang libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libayatana-appindicator3-dev libasound2-dev xvfb

      - name: Bootstrap vendored dependencies
        run: dart run tool/bootstrap_deps.dart

      - name: Install dependencies
        run: dart pub get

      # No libtim2tox_ffi: CMake only warns and the fake backend needs none.
      # The X screen is larger than the 1280x800 capture window so the
      # harness's exact-size check can hold.
      - name: Real-UI tests (fake backend)
        run: |
          set -euo pipefail
          flutter config --enable-linux-desktop
          cd apps/morsecq
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            flutter test integration_test -d linux \
            --dart-define=MORSECQ_FAKE_BACKEND=true

      - name: Screenshots
        env:
          MORSECQ_SHOT_STAGING: build/shot_staging
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            tool/screenshots/capture.sh --platforms linux --out build/screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-linux
          path: |
            build/screenshots
            build/shot_staging
          if-no-files-found: warn

  windows:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci:e2e')
    timeout-minutes: 60
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure Git line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      # capture.sh reads `flutter devices --machine` with python3; the
      # Windows image only has `python`.
      - name: Provide python3
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            mkdir -p "$HOME/shim"
            printf '#!/bin/sh\nexec python "$@"\n' > "$HOME/shim/python3"
            chmod +x "$HOME/shim/python3"
            echo "$HOME/shim" >> "$GITHUB_PATH"
          fi

      - name: Bootstrap vendored dependencies
        run: dart run tool/bootstrap_deps.dart

      - name: Install dependencies
        run: dart pub get

      # No tim2tox_ffi.dll: CMake only warns and the fake backend needs none.
      - name: Real-UI tests (fake backend)
        run: |
          set -euo pipefail
          flutter config --enable-windows-desktop
          cd apps/morsecq
          flutter test integration_test -d windows \
            --dart-define=MORSECQ_FAKE_BACKEND=true

      - name: Screenshots
        env:
          MORSECQ_SHOT_STAGING: build/shot_staging
        run: tool/screenshots/capture.sh --platforms windows --out build/screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-windows
          path: |
            build/screenshots
            build/shot_staging
          if-no-files-found: warn
