name: Builds and release
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
env:
  FLUTTER_VERSION: '3.41.9'
jobs:
  validate:
    uses: ./.github/workflows/analyze.yml
  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
          - os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          # Apple plugin outputs contain absolute paths from the runner image.
          pub-cache: ${{ matrix.platform != 'macos' }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev libasound2-dev rpm
      - name: Windows installer tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wix = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset*' | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wix) { throw 'WiX Toolset v3 missing' }
          Join-Path $wix.FullName 'bin' | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - run: dart pub get --enforce-lockfile
      - name: Drop generated Apple plugin output
        if: runner.os == 'macOS'
        run: bash tool/ci/clean_apple_plugin_cache.sh macos
      - name: Build offline application
        run: |
          flutter config --enable-${{ matrix.platform }}-desktop
          cd apps/morsecq
          flutter build ${{ matrix.platform }} --release --split-debug-info=build/symbols/${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ matrix.platform }}
          path: |
            apps/morsecq/build/symbols/
            apps/morsecq/build/macos/Build/Products/Release/**/*.dSYM
            apps/morsecq/build/windows/x64/runner/Release/*.pdb
          if-no-files-found: error
      - name: Inspect built Apple release
        if: runner.os == 'macOS'
        run: python tool/ci/release_preflight.py --output build/evidence/macos.json apple apps/morsecq/build/macos/Build/Products/Release/MorseCQ.app --platform macos
      - name: Inspect Linux native payload
        if: runner.os == 'Linux'
        run: python tool/ci/release_preflight.py --output build/evidence/linux.json native apps/morsecq/build/linux/x64/release/bundle --platform linux --architecture x86_64
      - name: Inspect Windows native payload
        if: runner.os == 'Windows'
        run: python tool/ci/release_preflight.py --output build/evidence/windows.json native apps/morsecq/build/windows/x64/runner/Release --platform windows --architecture x86_64
      - name: Package
        run: bash tool/ci/package_artifacts.sh --target ${{ matrix.platform }}
      - name: Hash final packaged artifacts
        run: python tool/ci/release_preflight.py --output build/evidence/artifacts.json hashes dist/${{ matrix.platform }}
      - name: Verify final Windows ZIP payload
        if: runner.os == 'Windows'
        run: python tool/ci/release_preflight.py --output build/evidence/windows-final.json native dist/windows/morsecq-*-windows-x64.zip --platform windows --architecture x86_64
      - name: Verify Windows installer metadata
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist/windows/*.msi | Select-Object -First 1).FullName
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase($msi, 0)
          $template = $database.SummaryInformation(0).Property(7)
          if ($template -notmatch '^x64;') { throw "Unexpected MSI Template Summary: $template" }
          $template | Out-File build/evidence/windows-msi-template.txt
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.platform }}
          path: build/evidence/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/*
          if-no-files-found: error
  android:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart pub get --enforce-lockfile
      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          count=0
          for value in "$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            [[ -z "$value" ]] || count=$((count + 1))
          done
          if [[ "$count" == 4 ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/morsecq-release.jks"
            echo "MORSECQ_ANDROID_KEYSTORE=$RUNNER_TEMP/morsecq-release.jks" >> "$GITHUB_ENV"
          elif [[ "$count" == 0 ]]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo 'Tagged Android releases require owner signing secrets.' >&2
              exit 1
            fi
            echo '::warning::No Android signing secrets: artifacts use the debug key for testing; configure owner signing for distribution.'
          else
            echo 'All four Android signing secrets must be provided together.' >&2
            exit 1
          fi
      - name: Build APK and App Bundle
        env:
          MORSECQ_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MORSECQ_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MORSECQ_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd apps/morsecq
          flutter build apk --release --split-debug-info=build/symbols/android
          flutter build appbundle --release --split-debug-info=build/symbols/android
      - name: Inspect final APK and App Bundle
        run: |
          curl -fL --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$RUNNER_TEMP/bundletool.jar"
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  '"$RUNNER_TEMP/bundletool.jar" | sha256sum --check
          python3 tool/ci/release_preflight.py --output build/evidence/android.json android \
            apps/morsecq/build/app/outputs/flutter-apk/app-release.apk \
            apps/morsecq/build/app/outputs/bundle/release/app-release.aab \
            --bundletool "$RUNNER_TEMP/bundletool.jar" \
            --apkanalyzer "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" --target-sdk 36
      - name: Verify every signed App Bundle entry
        run: java tool/ci/VerifyAndroidBundle.java apps/morsecq/build/app/outputs/bundle/release/app-release.aab - development > build/evidence/android-bundle-signing.json
      - name: Verify tagged Android signing identity
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          EXPECTED_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
        run: python3 tool/ci/verify_android_signing.py apps/morsecq/build/app/outputs/flutter-apk/app-release.apk apps/morsecq/build/app/outputs/bundle/release/app-release.aab --expected-sha256 "$EXPECTED_UPLOAD_CERT_SHA256"
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-android
          path: apps/morsecq/build/symbols/android/
          if-no-files-found: error
      - run: bash tool/ci/package_artifacts.sh --target android
      - run: python tool/ci/release_preflight.py --output build/evidence/artifacts.json hashes dist/android
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-android
          path: build/evidence/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/android/*
          if-no-files-found: error
  ios:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: false
      - run: dart pub get --enforce-lockfile
      - name: Drop generated Apple plugin output
        run: bash tool/ci/clean_apple_plugin_cache.sh ios
      - name: Build unsigned application
        run: |
          cd apps/morsecq
          flutter build ios --release --no-codesign --split-debug-info=build/symbols/ios
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-ios
          path: |
            apps/morsecq/build/symbols/ios/
            apps/morsecq/build/ios/iphoneos/**/*.dSYM
          if-no-files-found: error
      - name: Inspect built iOS device release
        run: python tool/ci/release_preflight.py --output build/evidence/ios.json apple apps/morsecq/build/ios/iphoneos/Runner.app --platform ios
      - run: bash tool/ci/package_artifacts.sh --target ios
      - run: python tool/ci/release_preflight.py --output build/evidence/artifacts.json hashes dist/ios
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-ios
          path: build/evidence/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: dist/ios/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, desktop, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify complete release assets and checksum manifest
        run: bash tool/ci/verify_release_assets.sh dist "$GITHUB_REF_NAME"
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            [[ "$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == true ]] || { echo 'Existing release is published; refusing to replace assets.' >&2; exit 1; }
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "MorseCQ $GITHUB_REF_NAME" --generate-notes -R "$GITHUB_REPOSITORY"
          fi
