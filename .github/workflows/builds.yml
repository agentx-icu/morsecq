name: Builds and release
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
env:
  FLUTTER_VERSION: '3.41.9'
jobs:
  validate:
    uses: ./.github/workflows/analyze.yml
  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
          - os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev libasound2-dev rpm
      - name: Windows installer tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wix = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset*' | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wix) { throw 'WiX Toolset v3 missing' }
          Join-Path $wix.FullName 'bin' | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - run: dart pub get --enforce-lockfile
      - name: Build offline application
        run: |
          flutter config --enable-${{ matrix.platform }}-desktop
          cd apps/morsecq
          flutter build ${{ matrix.platform }} --release
      - name: Package
        run: bash tool/ci/package_artifacts.sh --target ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/*
          if-no-files-found: error
  android:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart pub get --enforce-lockfile
      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          count=0
          for value in "$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            [[ -z "$value" ]] || count=$((count + 1))
          done
          if [[ "$count" == 4 ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/morsecq-release.jks"
            echo "MORSECQ_ANDROID_KEYSTORE=$RUNNER_TEMP/morsecq-release.jks" >> "$GITHUB_ENV"
          elif [[ "$count" == 0 ]]; then
            echo '::warning::No Android signing secrets: artifacts use the debug key and cannot upgrade a signed production install.'
          else
            echo 'All four Android signing secrets must be provided together.' >&2
            exit 1
          fi
      - name: Build APK and App Bundle
        env:
          MORSECQ_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MORSECQ_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MORSECQ_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd apps/morsecq
          flutter build apk --release
          flutter build appbundle --release
      - run: bash tool/ci/package_artifacts.sh --target android
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/android/*
          if-no-files-found: error
  ios:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart pub get --enforce-lockfile
      - name: Build unsigned application
        run: |
          cd apps/morsecq
          flutter build ios --release --no-codesign
      - run: bash tool/ci/package_artifacts.sh --target ios
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: dist/ios/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, desktop, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -- * > SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            [[ "$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == true ]] || { echo 'Existing release is published; refusing to replace assets.' >&2; exit 1; }
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "MorseCQ $GITHUB_REF_NAME" --generate-notes -R "$GITHUB_REPOSITORY"
          fi
