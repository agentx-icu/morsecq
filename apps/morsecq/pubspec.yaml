name: morsecq
description: "Morse code trainer + serverless Tox P2P Morse chat."
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  morse_core: ^0.1.0
  morse_io: ^0.1.0
  morse_trainer: ^0.1.0
  morsecq_chat_api: ^0.1.0
  path: ^1.9.0
  provider: ^6.1.0
  file_picker: ^13.1.0
  share_plus: ^13.3.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
